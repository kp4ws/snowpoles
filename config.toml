# All paths are relative to the root of the repository. Use forward slashes as separators, they will work on Windows as well.
# Traversing up is supported. Use ".." in the path to go up a directory.

[paths]
input_images = 'CHRL_data'
images_output = '' #TODO
trainee_model = 'models/CO_and_WA_model.pth'
models_output = 'models/output'
labels = 'CHRL_data/labels.csv'
pole_metadata = 'CHRL_data/pole_metadata.csv'

[labeling]
number_of_poles = 3 #TODO: Refactor code so it works for any amount of poles specified here
#pole_length = 104 # Length of poles -> Commented out because these vary in our implementation
subset_to_label = 10 # Label every N images

[training]
lr = 0.001 # Learning Rate 
epochs = 200 # Epochs
aug = false # whether to augment the data or not

device = "cpu" # Device to use, either "cuda" or "cpu".

batch_size = 8 # Batch size
show_dataset_plot = false # Show dataset plot
filter = false